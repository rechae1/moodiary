name: Build Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Flutter SDK
        run: |
          # 克隆 Flutter 到固定路径
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git C:\flutter
          
          # 将 Flutter 添加到系统 PATH（永久生效）
          echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          
          # 同时为当前会话添加 PATH（确保后续命令能找到）
          $env:Path += ";C:\flutter\bin"
          
          # 验证安装
          C:\flutter\bin\flutter --version

      - name: Setup Rust (nightly)
        run: |
          rustup default nightly
          rustc --version

      - name: Install dependencies
        run: |
          # 确保 PATH 包含 Flutter
          $env:Path += ";C:\flutter\bin"
          flutter pub get

      - name: Build Windows
        run: |
          $env:Path += ";C:\flutter\bin"
          flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moodiary-windows
          path: build/windows/runner/Release/
